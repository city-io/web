name: Build and Deploy Docker Image

on:
  push:

  delete:

  workflow_dispatch:

# Normalize the branch name across push and delete events so deleting a merged
# branch cancels its in-flight preview deploy before cleanup runs.
concurrency:
  group: nimbus-cityio-web-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'delete' }}

jobs:
  build-and-deploy:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.prayujt.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.prayujt.com/cityio-frontend:latest
            docker.prayujt.com/cityio-frontend:${{ github.sha }}
          cache-from: type=registry,ref=docker.prayujt.com/cityio-frontend:cache
          cache-to: type=registry,ref=docker.prayujt.com/cityio-frontend:cache,mode=max

      - name: Deploy
        uses: rayman-tech/nimbus-action@v2
        with:
          api-key: ${{ secrets.NIMBUS_API_KEY }}
          nimbus-server: https://nimbus.prayujt.com
          nimbus-path: nimbus.yaml

  cleanup:
    if: github.event_name == 'delete'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cleanup branch preview
        uses: rayman-tech/nimbus-action@v2
        with:
          api-key: ${{ secrets.NIMBUS_API_KEY }}
          nimbus-server: https://nimbus.prayujt.com
          nimbus-path: nimbus.yaml
