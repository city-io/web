syntax = "proto3";

package cityio.service.v1;

import "cityio/entity/v1/army_order.proto";
import "cityio/entity/v1/army.proto";
import "cityio/entity/v1/bag.proto";
import "cityio/entity/v1/common.proto";
import "cityio/entity/v1/ids.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

message TrainingOrder {
  cityio.entity.v1.TrainingOrderId training_order_id = 1;
  cityio.entity.v1.ArmyId army_id = 2;
  cityio.entity.v1.BuildingId barracks_id = 3;
  cityio.entity.v1.TroopType type = 4;
  int32 count = 5;
  optional google.protobuf.Timestamp started_at = 6;
  optional google.protobuf.Timestamp completes_at = 7;
}

message TrainTroopsRequest {
  cityio.entity.v1.BuildingId barracks_id = 1;
  cityio.entity.v1.TroopType type = 2;
  int32 count = 3;
}
message TrainTroopsResponse {
  TrainingOrder order = 1;
}

message ListTrainingOrdersRequest {
  cityio.entity.v1.BuildingId barracks_id = 1;
}
message ListTrainingOrdersResponse {
  repeated TrainingOrder orders = 1;
}

message GetArmyRequest {
  cityio.entity.v1.ArmyId army_id = 1;
}
message GetArmyResponse {
  cityio.entity.v1.ArmyId army_id = 1;
  cityio.entity.v1.EntityBag entities = 2;
}

message MoveArmyRequest {
  cityio.entity.v1.ArmyId army_id = 1;
  cityio.entity.v1.Coordinates destination = 2;
}
message MoveArmyResponse {}

message AttackArmyRequest {
  cityio.entity.v1.ArmyId army_id = 1;
  cityio.entity.v1.ArmyId target_army_id = 2;
}
message AttackArmyResponse {}

message ConquerSettlementRequest {
  cityio.entity.v1.ArmyId army_id = 1;
  cityio.entity.v1.CityId city_id = 2;
}
message ConquerSettlementResponse {}

message RetreatArmyRequest {
  cityio.entity.v1.ArmyId army_id = 1;
}
message RetreatArmyResponse {}

message PreviewArmyRouteRequest {
  cityio.entity.v1.ArmyId army_id = 1;
  cityio.entity.v1.Coordinates destination = 2;
}
message PreviewArmyRouteResponse {
  cityio.entity.v1.ArmyRoute route = 1;
  google.protobuf.Duration estimated_duration = 2;
}

message MergeArmiesRequest {
  cityio.entity.v1.ArmyId target_army_id = 1;
  cityio.entity.v1.ArmyId source_army_id = 2;
}
message MergeArmiesResponse {}

message SplitArmyRequest {
  cityio.entity.v1.ArmyId army_id = 1;
  repeated cityio.entity.v1.TroopStack troops = 2;
}
message SplitArmyResponse {
  cityio.entity.v1.ArmyId army_id = 1;
  cityio.entity.v1.EntityBag entities = 2;
}

message ListArmiesRequest {}
message ListArmiesResponse {
  repeated cityio.entity.v1.ArmyId army_ids = 1;
  cityio.entity.v1.EntityBag entities = 2;
}

// ArmyService trains, commands, fights, retreats, splits, and merges armies.
service ArmyService {
  rpc TrainTroops(TrainTroopsRequest) returns (TrainTroopsResponse);
  rpc ListTrainingOrders(ListTrainingOrdersRequest) returns (ListTrainingOrdersResponse);
  rpc GetArmy(GetArmyRequest) returns (GetArmyResponse);
  rpc PreviewArmyRoute(PreviewArmyRouteRequest) returns (PreviewArmyRouteResponse);
  rpc MoveArmy(MoveArmyRequest) returns (MoveArmyResponse);
  rpc AttackArmy(AttackArmyRequest) returns (AttackArmyResponse);
  rpc ConquerSettlement(ConquerSettlementRequest) returns (ConquerSettlementResponse);
  rpc RetreatArmy(RetreatArmyRequest) returns (RetreatArmyResponse);
  rpc MergeArmies(MergeArmiesRequest) returns (MergeArmiesResponse);
  rpc SplitArmy(SplitArmyRequest) returns (SplitArmyResponse);
  rpc ListArmies(ListArmiesRequest) returns (ListArmiesResponse);
}
