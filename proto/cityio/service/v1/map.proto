syntax = "proto3";

package cityio.service.v1;

import "cityio/entity/v1/common.proto";
import "cityio/entity/v1/bag.proto";

message GetMapRequest {}

// GetMapResponse is the full world snapshot used to bootstrap a client.
message GetMapResponse {
  repeated cityio.entity.v1.CityId city_ids = 1;
  repeated cityio.entity.v1.BuildingId building_ids = 2;
  cityio.entity.v1.EntityBag entities = 3;
}

message Tile {
  int32 x = 1;
  int32 y = 2;
  optional cityio.entity.v1.CityId city_id = 3;
  optional cityio.entity.v1.BuildingId building_id = 4;
}

message GetTileRequest {
  cityio.entity.v1.Coordinates coords = 1;
}
message GetTileResponse {
  Tile tile = 1;
}

message GetTerrainRequest {}

// GetTerrainResponse carries the whole map in one call.
//
// Each plane is packed one byte per tile in row-major order, so the value for
// (x, y) is at index y * width + x. At the current map size that is about 5 KB
// per plane — small enough that chunking or viewport queries would cost more
// than they save, and it lets the client cache the world for the session.
//
// Terrain is generated by the server from `seed` and does not change, so this
// response is stable for the lifetime of a world.
message GetTerrainResponse {
  int32 width = 1;
  int32 height = 2;
  int64 seed = 3;
  bytes terrain = 4; // cityio.entity.v1.TerrainType per tile
  bytes relief = 5; // cityio.entity.v1.ReliefType per tile
  bytes feature = 6; // cityio.entity.v1.FeatureType per tile
  bytes special = 7; // cityio.entity.v1.SpecialType per tile
  // rivers holds a 6-bit mask per tile: bit i means a river continues toward
  // neighbour i. Both tiles either side of a step carry the reciprocal bit, so
  // each renders its own half and rivers occupy no tile of their own.
  bytes rivers = 8;
}

// MapService serves world snapshots read from the persistence layer.
service MapService {
  rpc GetMap(GetMapRequest) returns (GetMapResponse);
  rpc GetTile(GetTileRequest) returns (GetTileResponse);
  rpc GetTerrain(GetTerrainRequest) returns (GetTerrainResponse);
}
