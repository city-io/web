syntax = "proto3";

package cityio.service.v1;

import "cityio/entity/v1/common.proto";
import "cityio/entity/v1/bag.proto";

message GetMapRequest {}

// GetMapResponse is the full world snapshot used to bootstrap a client.
message GetMapResponse {
  repeated cityio.entity.v1.CityId city_ids = 1;
  repeated cityio.entity.v1.BuildingId building_ids = 2;
  cityio.entity.v1.EntityBag entities = 3;
}

message Tile {
  int32 x = 1;
  int32 y = 2;
  optional cityio.entity.v1.CityId city_id = 3;
  optional cityio.entity.v1.BuildingId building_id = 4;
}

message GetTileRequest {
  cityio.entity.v1.Coordinates coords = 1;
}
message GetTileResponse {
  Tile tile = 1;
}

message GetTerrainRequest {}

// VisibleTerrain is the ground a player can see right now.
//
// Vision is ephemeral: it comes from cities, from armies while they stand
// somewhere, and from structures held against an enemy. Tiles therefore leave
// this set as often as they enter it, so it is always sent whole rather than as
// a reveal-only delta — replacing the set outright is the only way client and
// server cannot disagree about what is still lit.
//
// Tiles are addressed by row-major index (y * width + x). Each plane holds one
// byte per entry of `indices`, in the same order.
message VisibleTerrain {
  repeated int32 indices = 1;
  bytes terrain = 2; // cityio.entity.v1.TerrainType
  bytes relief = 3; // cityio.entity.v1.ReliefType
  bytes feature = 4; // cityio.entity.v1.FeatureType
  bytes special = 5; // cityio.entity.v1.SpecialType
  // rivers holds a 6-bit mask per tile: bit i means a river continues toward
  // neighbour i. Both tiles either side of a step carry the reciprocal bit, so
  // each renders its own half and rivers occupy no tile of their own.
  bytes rivers = 6;
}

// TerrainReveal carries tiles that have just been charted, with their static
// planes, to be merged into the client's permanent map. Terrain is remembered
// once seen, so this only ever adds — a tile never leaves the charted set.
//
// Each plane holds one byte per entry of `indices`, in the same order. Indices
// are row-major (y * width + x).
message TerrainReveal {
  repeated int32 indices = 1;
  bytes terrain = 2; // cityio.entity.v1.TerrainType
  bytes relief = 3; // cityio.entity.v1.ReliefType
  bytes feature = 4; // cityio.entity.v1.FeatureType
  bytes special = 5; // cityio.entity.v1.SpecialType
  // rivers holds a 6-bit mask per tile: bit i means a river continues toward
  // neighbour i, mirrored on the tile across that edge.
  bytes rivers = 6;
}

// MapVisibility is the visibility delta sent on the state stream as the player's
// units move.
message MapVisibility {
  // Tiles charted for the first time this update, if any.
  TerrainReveal revealed = 1;
  // The tiles the player can see right now, by row-major index. Sent whole
  // because live vision shrinks as well as grows — an army walking away dims
  // the ground it was lighting, even though the terrain stays remembered. A
  // subset of everything charted.
  repeated int32 visible = 2;
}

// GetTerrainResponse bootstraps a client with the map's dimensions, everything
// the player has charted so far, and what they can see at this moment.
//
// The static planes are packed one byte per tile in row-major order (index
// y * width + x) and are meaningful only where `explored` is set; unseen tiles
// are zero. At this map size the planes are a few KB and mostly zeros, which
// compresses to far less than a sparse coordinate list would cost.
message GetTerrainResponse {
  int32 width = 1;
  int32 height = 2;
  int64 seed = 3;
  bytes terrain = 4;
  bytes relief = 5;
  bytes feature = 6;
  bytes special = 7;
  bytes rivers = 8;
  // explored is a bitset in the same row-major order: bit y * width + x is set
  // for every tile the player has ever seen.
  bytes explored = 9;
  // visible lists the tiles in live view right now, a subset of explored.
  repeated int32 visible = 10;
}

// MapService serves world snapshots read from the persistence layer.
service MapService {
  rpc GetMap(GetMapRequest) returns (GetMapResponse);
  rpc GetTile(GetTileRequest) returns (GetTileResponse);
  rpc GetTerrain(GetTerrainRequest) returns (GetTerrainResponse);
}
