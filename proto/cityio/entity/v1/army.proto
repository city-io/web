syntax = "proto3";

package cityio.entity.v1;

import "cityio/entity/v1/common.proto";
import "cityio/entity/v1/ids.proto";

// TroopStack is a count of one troop type within an army.
message TroopStack {
  TroopType type = 1;
  optional int32 count = 2;
}

enum ArmyCompositionVisibility {
  ARMY_COMPOSITION_VISIBILITY_UNSPECIFIED = 0;
  ARMY_COMPOSITION_VISIBILITY_HIDDEN = 1;
  ARMY_COMPOSITION_VISIBILITY_TYPES_ONLY = 2;
  ARMY_COMPOSITION_VISIBILITY_EXACT = 3;
}

// Army is the physical state of a mobile group of troops. Active orders and
// battles are separate entities because their disclosure can differ.
message Army {
  ArmyId army_id = 1;
  UserId owner = 2;
  Coordinates coords = 3;
  repeated TroopStack troops = 4;
  reserved 5;
  ArmyCompositionVisibility composition_visibility = 6;
  optional ArmyOrderId order_id = 7;
  optional BattleId battle_id = 8;
}
