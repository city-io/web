syntax = "proto3";

package cityio.entity.v1;

import "cityio/entity/v1/common.proto";
import "cityio/entity/v1/ids.proto";
import "google/protobuf/duration.proto";

enum ArmyMarchDisclosure {
  ARMY_MARCH_DISCLOSURE_UNSPECIFIED = 0;
  ARMY_MARCH_DISCLOSURE_STATUS_ONLY = 1;
  ARMY_MARCH_DISCLOSURE_DESTINATION = 2;
  ARMY_MARCH_DISCLOSURE_FULL_ROUTE = 3;
}

message ArmyRouteStep {
  Coordinates coords = 1;
  bool explored = 2;
}

// ArmyMarch is the active movement order and its current projected route.
// The server filters its fields independently for each viewer.
message ArmyMarch {
  ArmyMarchId army_march_id = 1;
  ArmyId army_id = 2;
  ArmyMarchDisclosure disclosure = 3;
  optional Coordinates destination = 4;
  repeated ArmyRouteStep remaining_route = 5;
  optional google.protobuf.Duration estimated_remaining_duration = 6;
}
